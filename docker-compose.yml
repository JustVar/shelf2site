# Runs the app and its database on one machine.
#
#   cp .env.template .env      # then fill in the three GENERATE values
#   docker compose up -d --build
#   docker compose exec app python -m scripts.create_admin_user admin "Your Name"
#   open http://localhost:8081
#
# The app builds the schema on first start. Data lives in two named volumes,
# so `docker compose down` keeps it and `docker compose down -v` deletes it.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_tracker
      POSTGRES_USER: asset_tracker_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_tracker_user -d asset_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://asset_tracker_user:${POSTGRES_PASSWORD}@db:5432/asset_tracker
    volumes:
      # Photos, receipts and certification reports.
      - appdata:/app/data
      # Contract tests, mounted so `docker compose exec app python -m pytest
      # tests/ -q` runs the current files without a rebuild.
      - ./tests:/app/tests:ro
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:8081/login"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  appdata:
