<!-- Global Edit Modal -->
<div class="modal-overlay gem-overlay" id="gem-overlay">
  <div class="gem-modal">

    <!-- Header -->
    <div class="gem-header">
      <div class="gem-header-left">
        <div class="gem-category-badge"
             id="gem-category-badge"></div>
        <h2 class="gem-title" id="gem-title">Edit Device</h2>
      </div>
      <button class="gem-close-btn"
              onclick="GlobalEditModal.close()">
        <svg viewBox="0 0 24 24" width="18" height="18"
             fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Loading state -->
    <div id="gem-loading"
         style="text-align:center;padding:2rem;
                color:var(--sx-gray-dim);">
      Loading...
    </div>

    <!-- Form body -->
    <div id="gem-body" style="display:none;">

      <!-- Common fields -->
      <div class="gem-section">
        <div class="gem-section-label">Details</div>
        <div id="gem-common-fields"
             class="gem-fields-grid"></div>
      </div>

      <!-- Category-specific fields -->
      <div id="gem-category-section" class="gem-section">
        <div class="gem-section-label"
             id="gem-category-section-label">
          Additional Fields
        </div>
        <div id="gem-category-fields"
             class="gem-fields-grid"></div>
      </div>

      <!-- Notes -->
      <div class="gem-section">
        <div class="gem-section-label">Notes</div>
        <div class="gem-field gem-field--full">
          <textarea class="gem-input gem-textarea"
                    name="notes" rows="3"
                    placeholder="Any additional notes..."></textarea>
        </div>
      </div>

      <!-- Procurement (collapsible) -->
      <details class="gem-details">
        <summary class="gem-details-summary">
          Procurement Details
        </summary>
        <div id="gem-procurement-fields"
             class="gem-fields-grid gem-fields-grid--procurement">
        </div>
      </details>

    </div>

    <!-- Error / Success -->
    <div id="gem-error"
         class="gem-message gem-message--error"
         style="display:none;"></div>
    <div id="gem-success"
         class="gem-message gem-message--success"
         style="display:none;"></div>

    <!-- Footer -->
    <div class="gem-footer">
      <button class="eb-btn-cancel"
              onclick="GlobalEditModal.close()">Cancel</button>
      <button class="eb-btn-edit" id="gem-save-btn"
              onclick="GlobalEditModal.save()">Save Changes</button>
    </div>

  </div>
</div>
