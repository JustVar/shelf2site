<!-- Contact Admin Modal -->
<div class="gem-overlay" id="contact-admin-modal">
  <div class="gem-modal" style="max-width:480px">
    <div class="gem-header">
      <div class="gem-header-left">
        <span class="gem-category-badge">SUPPORT</span>
        <h3 class="gem-title">Contact Administrator</h3>
      </div>
      <button class="gem-close-btn" id="contact-admin-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="gem-section" style="padding-bottom:1.4rem">
      <p style="color:var(--sx-gray);font-size:13px;margin-bottom:1rem;">
        Describe what you need access to or the issue you're experiencing. An administrator will follow up with you directly.
      </p>
      <textarea id="contact-admin-message"
        placeholder="e.g. I need access to the Receiving feature to log incoming hardware..."
        style="width:100%;min-height:100px;background:var(--sx-surface);border:1px solid var(--sx-border);border-radius:6px;padding:10px;color:var(--sx-white);font-size:13px;resize:vertical;font-family:var(--sx-font-sans);"
      ></textarea>
      <div id="contact-admin-feedback" style="margin-top:0.6rem;font-size:12px;min-height:18px;"></div>
    </div>
    <div class="gem-footer" style="display:flex;justify-content:flex-end;gap:8px;padding:1rem 1.4rem;">
      <button class="sx-btn sx-btn--ghost" onclick="closeContactAdminModal()">Cancel</button>
      <button class="sx-btn sx-btn--primary" onclick="submitContactAdmin()">Send Message</button>
    </div>
  </div>
</div>
