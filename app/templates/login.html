<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asset Tracker</title>
    <link rel="icon" type="image/png" sizes="96x96" href="{{ base_path }}/static/icons/icon-96.png">
    <link rel="stylesheet" href="{{ base_path }}/static/css/fonts.css?v={{ request.state.js_v('css/fonts.css') or '0' }}">
    <script>
        // Apply saved theme immediately to prevent flash
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        [data-theme="dark"] {
            --primary: #0B0D12;
            --accent-primary: #C29E9B;
            --accent-primary-l: #E3CBC7;
            --accent-primary-dim: rgba(194,158,155,0.12);
            --accent-border: rgba(194,158,155,0.45);
            --on-accent: #17222E;
            --danger: #FF6B6B;
            --red-dim: rgba(255,107,107,0.12);
            --text: #EDF0F6;
            --text-muted: #97A3B6;
            --card-bg: #151821;
            --card-edge: rgba(255,255,255,0.10);
            --border: rgba(148,163,184,0.13);
            --input-bg: #0B0D12;
            --grid-dot: rgba(148,163,184,0.10);
            --aurora-1: rgba(194,158,155,0.10);
        }

        [data-theme="light"] {
            --primary: #F5F6F8;
            --accent-primary: #85605E;
            --accent-primary-l: #C29E9B;
            --accent-primary-dim: rgba(133,96,94,0.08);
            --accent-border: rgba(133,96,94,0.40);
            --on-accent: #FFFFFF;
            --danger: #C43D45;
            --red-dim: rgba(196,61,69,0.10);
            --text: #1B2028;
            --text-muted: #5C6675;
            --card-bg: #FFFFFF;
            --card-edge: rgba(255,255,255,0.9);
            --border: #E2E5EB;
            --input-bg: #F8F9FB;
            --grid-dot: rgba(27,32,40,0.13);
            --aurora-1: rgba(133,96,94,0.20);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* dot grid + one subtle aurora blob (CSS only; no spotlight, no lap) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 520px;
            height: 520px;
            left: -140px;
            top: -160px;
            border-radius: 50%;
            background: var(--aurora-1);
            filter: blur(60px);
            pointer-events: none;
            animation: login-drift 18s ease-in-out infinite;
        }
        @keyframes login-drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(120px, 60px); }
        }
        @media (prefers-reduced-motion: reduce) {
            body::after { animation: none; }
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            color: var(--text);
            border-color: var(--accent-border);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-top-color: var(--card-edge);
            border-radius: 14px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.30);
            position: relative;
            z-index: 1;
        }

        .login-card h1 {
            color: var(--text);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .login-card .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-dim);
        }

        .btn-login {
            width: 100%;
            padding: 0.7rem;
            background: var(--accent-primary);
            color: var(--on-accent);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .btn-login:hover {
            filter: brightness(1.06);
        }

        .error-msg {
            background: var(--red-dim);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.6rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleLoginTheme()" id="login-theme-btn" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.25rem;">
            <img src="{{ base_path }}/static/img/logo-brand-full.png?v={{ request.state.js_v('img/logo-brand-full.png') or '0' }}" alt="the company" style="height: 110px; width: auto; max-width: 100%;">
        </div>
        <h1>Asset Tracker</h1>
        <p class="subtitle">Sign in to continue</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ base_path }}/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <script>
        function toggleLoginTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateLoginThemeIcon(next);
        }

        function updateLoginThemeIcon(theme) {
            const btn = document.getElementById('login-theme-btn');
            if (theme === 'dark') {
                btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
            } else {
                btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            }
        }

        // Set correct icon on load
        updateLoginThemeIcon(document.documentElement.getAttribute('data-theme'));
    </script>
</body>
</html>
