# Runs the contract suite against a fresh database, then builds the Docker
# image and brings the compose stack up with the demo data.
# Every action is pinned to a commit, so a step cannot change under the build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asset_tracker
          POSTGRES_USER: asset_tracker_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asset_tracker_user -d asset_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: asset_tracker_user
      PGPASSWORD: ci-only-password
      PGHOST: 127.0.0.1
      PGDATABASE: asset_tracker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch the password blocklist
        run: bash scripts/fetch_password_blocklist.sh
      - name: Generate secrets for this run
        run: |
          echo "DATABASE_URL=postgresql://$PGUSER:$PGPASSWORD@$PGHOST:5432/$PGDATABASE" >> "$GITHUB_ENV"
          echo "SESSION_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Build the schema
        run: python -m scripts.init_db
      - name: Start the app
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8081 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8081/login && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: Contract suite
        run: python -m pytest tests/ -q
      - name: Load the demo data
        run: python -m scripts.seed_demo
      - name: Contract suite on the demo data
        run: python -m pytest tests/ -q
      - name: App log
        if: failure()
        run: cat app.log

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Write .env
        run: |
          cp .env.template .env
          sed -i "s|^POSTGRES_PASSWORD=GENERATE|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^SESSION_SECRET_KEY=GENERATE|SESSION_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^CREDENTIAL_ENCRYPTION_KEY=GENERATE|CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')|" .env
          ! grep -n GENERATE .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Load the demo data
        run: docker compose exec -T app python -m scripts.seed_demo
      - name: Sign in as the demo user
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -c jar -b jar \
            --data 'username=demo&password=harbor-lantern-quilt-42' http://127.0.0.1:8081/login)
          test "$code" = 302
          curl -fs -b jar http://127.0.0.1:8081/fulfillment/ | grep -q 'Fulfillment'
      - name: Contract suite in the container
        run: docker compose exec -T app python -m pytest tests/ -q
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
