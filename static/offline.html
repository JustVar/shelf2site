<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Asset Tracker</title>
    <style>
        :root { --brand: #157ca4; --bg: #1a1d23; --text: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem; text-align: center;
        }
        .offline-card {
            max-width: 420px; padding: 3rem 2rem;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            background: rgba(255,255,255,0.03);
        }
        .offline-icon {
            width: 64px; height: 64px; margin: 0 auto 1.5rem;
            color: var(--brand); opacity: 0.8;
        }
        h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
        p { color: #999; line-height: 1.6; margin-bottom: 1.5rem; }
        .retry-btn {
            display: inline-block; padding: 0.6rem 1.5rem;
            background: var(--brand); color: #fff; border: none;
            border-radius: 6px; font-size: 0.9rem; cursor: pointer;
            text-decoration: none;
        }
        .retry-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="offline-card">
        <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        <h1>You're Offline</h1>
        <p>The Asset Tracker needs a network connection to load data. Check your connection to the lab network and try again.</p>
        <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
