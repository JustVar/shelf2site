# Example nginx site for Shelf2Site behind TLS. See docs/HTTPS.md.
#
# The app listens on 127.0.0.1:8081 and is mounted under /assettracker/
# (set ROOT_PATH=/assettracker in .env to match). TLS terminates here; the
# app sees X-Forwarded-Proto https and turns on Secure cookies and HSTS.
# Replace the server_name and certificate paths with your own.

upstream assettracker {
    server 127.0.0.1:8081;
    keepalive 2;
}

server {
    listen 443 ssl http2;
    server_name assets.example.com;

    ssl_certificate     /etc/ssl/asset-tracker/asset-tracker.crt;
    ssl_certificate_key /etc/ssl/asset-tracker/asset-tracker.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;
    keepalive_timeout 15s;
    keepalive_requests 100;

    location = / {
        return 302 /assettracker/;
    }

    location /assettracker/ {
        proxy_pass http://assettracker/;
        proxy_redirect ~^https?://[^/]+/(.*)$ /assettracker/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events stay open; the app sends a keepalive every ~30 s
        # and X-Accel-Buffering: no, so no separate SSE location is needed.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache" always;
    }

    location /assettracker/static/ {
        alias /opt/asset_tracker/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Plain HTTP: send everything to HTTPS, keeping the path and query.
server {
    listen 80;
    server_name assets.example.com;
    return 301 https://$host$request_uri;
}
