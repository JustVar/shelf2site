upstream assettracker {
    server 127.0.0.1:8081;
    keepalive 2;
}

# ── HTTPS front door (port 8443; 443 is held by the docker registry) ──
# getUserMedia / service worker require a secure context, which this
# provides. TLS terminates here; the app sees X-Forwarded-Proto https and
# turns on Secure cookies + HSTS. Locations mirror the legacy :8100 block
# exactly so SSE (X-Accel-Buffering:no honored), caching, and forwarded
# headers behave identically. Cert: mkcert leaf at /etc/ssl/asset-tracker.
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/asset-tracker/asset-tracker.crt;
    ssl_certificate_key /etc/ssl/asset-tracker/asset-tracker.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;
    keepalive_timeout 15s;
    keepalive_requests 100;

    # Plain HTTP sent to this TLS port answers 497; redirect to the same
    # URL over HTTPS instead of nginx's raw 400 error page.
    error_page 497 https://$host:$server_port$request_uri;

    location /assettracker/ {
        proxy_pass http://assettracker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache" always;
    }

    location /assettracker/static/ {
        alias /opt/asset_tracker/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Legacy HTTP front door (port 8100) ──
# Kept proxying during cutover as a fallback; step B flips it to a 301 to
# HTTPS once :8443 is verified.
server {
    # Legacy HTTP front door -> permanent redirect to HTTPS. Preserves the
    # full request URI (incl. /assettracker/ root path + query) so every
    # existing bookmark keeps landing exactly where it did. $host carries no
    # port, so this always targets :8443.
    listen 8100;
    server_name _;
    return 301 https://$host:8443$request_uri;
}
